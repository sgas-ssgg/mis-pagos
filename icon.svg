<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Fondo degradado azul a verde -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#1a6fd4"/>
      <stop offset="50%"  stop-color="#1e9fd4"/>
      <stop offset="100%" stop-color="#22c97a"/>
    </linearGradient>

    <!-- Degradado moneda dorada -->
    <radialGradient id="coinGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%"   stop-color="#ffe066"/>
      <stop offset="50%"  stop-color="#f5c030"/>
      <stop offset="100%" stop-color="#c98a00"/>
    </radialGradient>

    <!-- Sombra moneda -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="rgba(0,0,0,0.35)"/>
    </filter>

    <!-- Sombra texto -->
    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.4)"/>
    </filter>

    <!-- Clip redondeado -->
    <clipPath id="rounded">
      <rect width="512" height="512" rx="115"/>
    </clipPath>
  </defs>

  <!-- Fondo -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>

  <!-- ===== VELOCÍMETRO / RELOJ ===== -->
  <!-- Arco exterior blanco semitransparente -->
  <circle cx="256" cy="210" r="155" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="22"/>

  <!-- Arco superior (semicírculo, tipo velocímetro) -->
  <!-- Arco de fondo gris -->
  <path d="M 108 210 A 148 148 0 0 1 404 210"
        fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="18" stroke-linecap="round"/>

  <!-- Arco activo blanco -->
  <path d="M 118 240 A 148 148 0 0 1 394 240"
        fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="14" stroke-linecap="round"/>

  <!-- Marcas del velocímetro -->
  <!-- 12 marcas distribuidas en semicírculo superior -->
  <g stroke="rgba(255,255,255,0.7)" stroke-linecap="round">
    <!-- marca 0° (izquierda) -->
    <line x1="108" y1="210" x2="124" y2="210" stroke-width="4"/>
    <!-- marca 30° -->
    <line x1="122" y1="136" x2="136" y2="148" stroke-width="4"/>
    <!-- marca 60° -->
    <line x1="182" y1="84"  x2="190" y2="100" stroke-width="4"/>
    <!-- marca 90° (arriba) -->
    <line x1="256" y1="64"  x2="256" y2="82"  stroke-width="6"/>
    <!-- marca 120° -->
    <line x1="330" y1="84"  x2="322" y2="100" stroke-width="4"/>
    <!-- marca 150° -->
    <line x1="390" y1="136" x2="376" y2="148" stroke-width="4"/>
    <!-- marca 180° (derecha) -->
    <line x1="404" y1="210" x2="388" y2="210" stroke-width="4"/>
  </g>

  <!-- Aguja del velocímetro apuntando arriba-derecha -->
  <line x1="256" y1="210" x2="318" y2="112"
        stroke="white" stroke-width="8" stroke-linecap="round"
        filter="url(#shadow)"/>
  <!-- Centro de la aguja -->
  <circle cx="256" cy="210" r="12" fill="white"/>
  <circle cx="256" cy="210" r="6"  fill="#1a6fd4"/>

  <!-- ===== MONEDA DORADA CON CHECK ===== -->
  <g filter="url(#shadow)">
    <!-- Sombra base de la moneda -->
    <circle cx="256" cy="295" r="105" fill="rgba(0,0,0,0.2)"/>

    <!-- Moneda exterior (borde más oscuro) -->
    <circle cx="256" cy="288" r="105" fill="#c98a00"/>

    <!-- Moneda interior (cara brillante) -->
    <circle cx="256" cy="288" r="94"  fill="url(#coinGrad)"/>

    <!-- Brillo superior de la moneda -->
    <ellipse cx="230" cy="248" rx="45" ry="25"
             fill="rgba(255,255,255,0.25)" transform="rotate(-20,230,248)"/>

    <!-- Check mark blanco -->
    <polyline points="198,288 238,330 318,245"
              fill="none" stroke="white" stroke-width="26"
              stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ===== TEXTO "MIS PAGOS" ===== -->
  <text x="256" y="440"
        text-anchor="middle"
        font-family="Arial Black, Arial, sans-serif"
        font-size="62"
        font-weight="900"
        fill="white"
        letter-spacing="2"
        filter="url(#textShadow)">MIS PAGOS</text>
</svg>
