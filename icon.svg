<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Fondo redondeado -->
  <rect width="512" height="512" rx="110" fill="#0f1117"/>
  
  <!-- Gradiente principal -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f6ef7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6d56f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4f6ef7;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Tarjeta principal -->
  <rect x="72" y="160" width="368" height="230" rx="36" fill="url(#grad1)"/>
  
  <!-- Banda magnética superior de la tarjeta -->
  <rect x="72" y="210" width="368" height="52" fill="rgba(0,0,0,0.25)"/>
  
  <!-- Chip dorado -->
  <rect x="118" y="278" width="70" height="52" rx="10" fill="#f5c842"/>
  <rect x="128" y="288" width="50" height="32" rx="6" fill="#e6a800"/>
  <!-- Líneas del chip -->
  <line x1="153" y1="288" x2="153" y2="320" stroke="#f5c842" stroke-width="2"/>
  <line x1="128" y1="304" x2="178" y2="304" stroke="#f5c842" stroke-width="2"/>

  <!-- Círculos logo tipo Mastercard -->
  <circle cx="340" cy="304" r="34" fill="#ef4444" opacity="0.9"/>
  <circle cx="374" cy="304" r="34" fill="#f97316" opacity="0.85"/>

  <!-- Número de tarjeta (puntos) -->
  <circle cx="120" cy="358" r="6" fill="rgba(255,255,255,0.7)"/>
  <circle cx="138" cy="358" r="6" fill="rgba(255,255,255,0.7)"/>
  <circle cx="156" cy="358" r="6" fill="rgba(255,255,255,0.7)"/>
  <circle cx="174" cy="358" r="6" fill="rgba(255,255,255,0.7)"/>

  <circle cx="204" cy="358" r="6" fill="rgba(255,255,255,0.7)"/>
  <circle cx="222" cy="358" r="6" fill="rgba(255,255,255,0.7)"/>
  <circle cx="240" cy="358" r="6" fill="rgba(255,255,255,0.7)"/>
  <circle cx="258" cy="358" r="6" fill="rgba(255,255,255,0.7)"/>

  <!-- Símbolo S/ encima -->
  <circle cx="256" cy="106" r="58" fill="url(#grad2)" opacity="0.95"/>
  <text x="256" y="122" text-anchor="middle" font-family="Arial, sans-serif" 
        font-size="52" font-weight="900" fill="white">S/</text>
</svg>
